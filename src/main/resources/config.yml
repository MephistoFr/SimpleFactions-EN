# ============================================
# SimpleFactions plugin configuration
# ============================================

settings:
  # Maximum power of a player
  max-power: 10.0
  # Power lost on death (negative = loss)
  power-per-death: -2.0
  # Power gained by the killer on each kill
  power-per-kill: 1.0
  # Power regenerated per minute
  power-regen-per-min: 1.0
  # Regeneration interval (seconds)
  power-regen-delay-seconds: 30
  # Maximum number of members per faction
  max-members: 50
  # Invitation validity duration (seconds)
  invite-expire-seconds: 300
  # Maximum faction name length
  max-name-length: 16
  # Allow overclaim (claiming a weakened faction's land)
  overclaim: true
  # Automatic data save (minutes)
  autosave-minutes: 5

